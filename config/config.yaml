model:
  pretrained_name: distilbert-base-uncased
  output_dir: ../models/distilbert-finetuned # modify according to finetuned model location
  max_length: 128

training:
  epochs: 4
  batch_size: 8
  learning_rate: 0.00002
  weight_decay: 0.01
  seed: 42

data:
  train_file: data/train.csv
  validation_file: data/validation.csv

labels:
  - normal
  - fire
  - medical
  - security
  - distress
  - hazard_report

# modify to the confidence score to alert
inference:
  alert_threshold: 0.80
